# CI do monorepo da Floway. O NOME DO JOB vira o nome do check que a proteção da `main` exige.
# Os comandos da raiz rodam em todos os workspaces (hoje só apps/site).
name: CI

# Roda em todo push de qualquer branch: a branch é checada no GitHub antes de ir para a main.
on:
  push:
    branches: ['**']

permissions:
  contents: read

# Um push novo na mesma branch cancela a execução antiga.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes, tipos e build
    # shortcut: fixo porque o Playwright 1.56 não instala o Chromium no ubuntu-latest (26.04), trocar ao atualizar o Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:build
